<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#1b4965" />
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e08e00" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="360" height="260" fill="#ffffff" rx="10" />

  <!-- Outer Elegant Frame -->
  <rect x="12" y="12" width="336" height="236" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <g transform="translate(180, 72)" text-anchor="middle">
    <!-- Globe & Export Flow Emblem -->
    <circle r="42" fill="#f8fafc" stroke="#1b4965" stroke-width="2.5" filter="url(#subtleShadow)" />
    
    <!-- Globe Latitudes / Longitudes -->
    <ellipse cx="0" cy="0" rx="42" ry="18" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2" />
    <ellipse cx="0" cy="0" rx="18" ry="42" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2" />
    <line x1="-42" y1="0" x2="42" y2="0" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="0" y1="-42" x2="0" y2="42" stroke="#94a3b8" stroke-width="1.2" />

    <!-- Circular Export / Import Flow Arrows -->
    <path d="M -24 -24 A 34 34 0 0 1 28 -18" fill="none" stroke="#e08e00" stroke-width="3" stroke-linecap="round" />
    <polygon points="32,-20 28,-10 20,-16" fill="#e08e00" />

    <path d="M 24 24 A 34 34 0 0 1 -28 18" fill="none" stroke="#1b4965" stroke-width="3" stroke-linecap="round" />
    <polygon points="-32,20 -28,10 -20,16" fill="#1b4965" />

    <!-- Center Shield / Star -->
    <circle r="12" fill="#1b4965" />
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <!-- Main Acronym -->
    <text x="180" y="152" font-family="'Arial Black', 'Montserrat', 'Helvetica', sans-serif" font-size="28" font-weight="900" fill="#0f2b48" letter-spacing="4">
      IEC
    </text>

    <!-- Subtitle Banner -->
    <rect x="70" y="164" width="220" height="22" rx="4" fill="#1b4965" />
    <text x="180" y="179" font-family="'Arial', 'Segoe UI', sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" letter-spacing="1.2">
      IMPORT EXPORT CODE
    </text>

    <!-- Government Authority -->
    <text x="180" y="206" font-family="'Arial', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#e08e00" letter-spacing="1">
      DGFT • GOVT. OF INDIA
    </text>

    <!-- Ministry Detail -->
    <text x="180" y="224" font-family="'Arial', 'Segoe UI', sans-serif" font-size="9" font-weight="500" fill="#64748b" letter-spacing="0.5">
      Ministry of Commerce &amp; Industry
    </text>
  </g>
</svg>
